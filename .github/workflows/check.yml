name: check

# The same gates as scripts/check.sh, minus the parts that only make sense on
# the developer's machine (`scripts/install.sh`, which rewrites ~/.cargo/bin),
# except for one smoke check that the alias it creates still runs.
# demo.sh is included: its pixel assertions are the end-to-end contract.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned, not `-latest`: ubuntu-latest moves to 26.04 in November 2026,
    # which changes ffmpeg and the linker under a pixel-asserting demo.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      # Keep CI builds portable. `.cargo/config.toml` targets the local CPU
      # for speed, but the shared rust-cache can restore a proc-macro built
      # for a different runner CPU; loading it makes clippy SIGILL. Setting
      # RUSTFLAGS overrides the config flags, so ask only for the local lld
      # link.
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v4

      # lld: .cargo/config.toml links through clang with `-fuse-ld=lld`, and
      #      targets the runner's CPU (-C target-cpu=native).
      # xxd: demo.sh samples pixels with it.
      # shellcheck: the scripts below are part of the contract.
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld xxd shellcheck

      # Ubuntu 24.04 ships ffmpeg 6.1, which cannot spell the export's
      # `-/filter_complex` (a 9.x option, so every export failed here). BtbN's
      # 9.0 build tracks the 9.0.x release branch; the ~147 MB download is
      # cheaper than building ffmpeg and keeps the tests' pixels stable.
      - name: Install ffmpeg 9
        run: |
          curl -fsSL -o /tmp/ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz
          mkdir -p "$HOME/ffmpeg"
          tar -xJf /tmp/ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=1
          "$HOME/ffmpeg/bin/ffmpeg" -version | head -1
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Shell scripts
        run: shellcheck scripts/check.sh scripts/install.sh demo.sh

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # -D warnings makes a broken intra-doc link or an unescaped `<Type>` a
      # failure; the codebase is doc-comment-heavy, so it is cheap insurance.
      - name: Docs
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test
        run: cargo test --locked

      # The headless variant is a supported build (AGENTS.md): its tests are
      # the 55 CLI/unit ones that don't need ratatui.
      - name: Test headless
        run: cargo test --locked -p nile --no-default-features

      - name: Build release
        run: cargo build --locked --release

      # The install path is a documented compatibility promise (README: `nile`
      # plus an `nle` alias), and it is the one gate check.sh has that CI did
      # not. The runner is discarded, so installing here is free.
      - name: Install and alias
        run: |
          ./scripts/install.sh
          nile --version
          nle --version

      - name: Demo (pixel checks)
        run: ./demo.sh

  macos:
    # The documented macOS path: Apple's linker (the config asks for lld on
    # Linux only) and VideoToolbox as the preview engine. The pixel demo
    # stays Linux-only so the end-to-end contract has one reference renderer.
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      # Portable flags for the shared cache: the config's `target-cpu=native`
      # is overridden for the same SIGILL reason as the Linux job.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      # ffmpeg 9 for `-/filter_complex` and the behaviour tests; shellcheck
      # for the script gate. mpv/yazi are runtime-only (tests use FakeMpv).
      - name: Install system tools
        run: brew install ffmpeg shellcheck

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Shell scripts
        run: shellcheck scripts/check.sh scripts/install.sh demo.sh

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Docs
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test
        run: cargo test --locked

      - name: Test headless
        run: cargo test --locked -p nile --no-default-features

      - name: Build release
        run: cargo build --locked --release
